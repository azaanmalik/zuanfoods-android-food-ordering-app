name: Android build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android source
        id: source
        shell: bash
        run: |
          if [ -f app/build.gradle.kts ] && [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Android source upload is pending'
          fi
      - name: Install Android SDK Platform 34
        if: steps.source.outputs.present == 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Build debug APK and run unit tests
        if: steps.source.outputs.present == 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
